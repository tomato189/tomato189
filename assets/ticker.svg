  <stop offset="0.3" stop-color="#fff" stop-opacity="0.05"/>
  <stop offset="0.62" stop-color="#000" stop-opacity="0"/>
  <stop offset="1" stop-color="#3A0000" stop-opacity="0.45"/>
</radialGradient>

<style>
text { font-family: 'Inter', 'SF Pro Display', 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }
.serif { font-family: Georgia, 'Times New Roman', serif; font-style: italic; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.run { animation: run 34s linear infinite; } @keyframes run { to { transform: translateX(-2220px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
