<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 72" width="1000" height="72" role="img" aria-labelledby="t d">
<title id="t">Tools ticker</title>
<desc id="d">A scrolling ticker of every tool: JavaScript, C++, Ruby, Python, HTML5, CSS3, Node.js, React Native, Expo, Electron, MongoDB, Visual Studio Code.</desc>
<defs>
