<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 262" width="1000" height="262" role="img" aria-labelledby="t d">
<title id="t">About Ahmad</title>
<desc id="d">Ahmad is 19 and writes code from Iraq. Tools are Node.js, React Native, Expo, Electron and MongoDB, all written in Visual Studio Code. Four languages and twelve tools in total.</desc>
